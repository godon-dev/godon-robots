name: engine
target: systemtender/engine
workspace: godon

scripts:
  - script: "systemtender_worker"
    sandbox: "ghcr.io/godon-dev/godon-robots"
    tag_env: "ROBOT_VERSION"
    settings:
      summary: "Godon Systemtender Engine"
      description: "Generic systemtender worker engine. Runs the trial loop — walks, holds, leases, guardrails, rollback, metrics — and loads domain-specific strains for the dial set."
      tag: "robot"
      # windmill is our job fabric, not our lifecycle policy: the tender's
      # end is declared by the worker itself and bounded by the cell
      # watchdog. This ceiling only exists so a windmill-side default can
      # never assassinate a mid-walk worker again.
      timeout: 2147483647
