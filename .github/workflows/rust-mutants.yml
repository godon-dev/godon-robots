name: Rust Mutants

# The test-discrimination instrument: cargo-mutants breaks the engine's
# pure decision surface (seek / seek_policy / walk_policy) in small ways
# and checks the suite notices. The same postgres service the parity
# harness uses, so the ledger-backed tests judge every mutant too.
#
# Manual dispatch — a measurement run, not a per-PR gate. The outcomes
# land as an artifact (outcomes.json + full log); the kill rate and the
# surviving-mutant map are the read.

on:
  workflow_dispatch:

jobs:
  mutants:
    name: cargo mutants (engine decision surface)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LEDGER_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Baseline (the suite must be green before breaking it)
        run: cargo test -p godon-engine --quiet

      - name: cargo mutants
        run: |
          cargo mutants \
            -p godon-engine \
            -f 'engine/src/seek.rs' \
            -f 'engine/src/seek_policy.rs' \
            -f 'engine/src/walk_policy.rs' \
            --output mutants.out

      - name: The verdict line
        run: tail -3 mutants.out/mutants.log 2>/dev/null || tail -3 /tmp/mutants-run.log 2>/dev/null || true

      - name: Upload outcomes
        uses: actions/upload-artifact@v4
        with:
          name: mutants-outcomes
          path: mutants.out/
