name: Rust Tests

# Vessel rung 10: the rust port's parity harness. The engine crate's
# tests are the byte-exact mirror of the committed golden cases — CI
# green here is the port slices' exit criterion. Slice 2 adds the real
# postgres (the service the python suite ran, before delpy): the golden
# fixture test drives the actual ledger verbs and compares
# byte-for-byte against the one committed artifact the rust engine
# and the godon-images readers share.

on:
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LEDGER_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - name: fmt
        run: |
          rustup component add rustfmt
          cargo fmt --check
      - name: clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: .
        run: |
          cargo --version
          cargo test --all
