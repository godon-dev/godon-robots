[package]
name = "godon-effectuation"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The effectuation leaves — generic HTTP config application and the windmill-ansible playbook runner, ported from the python originals"

[dependencies]
serde_json = "1"
# leveled diagnostics (severity + RUST_LOG); the binary inits the logger
log = "0.4"
# basic auth's base64 credential blob (python stdlib base64)
base64 = "0.22"
# the windmill-backed edges (auth variables, the playbook runner)
godon-wmill = { path = "../wmill" }
# Blocking, no TLS — the estate's effectuation endpoints are plain
# http inside the cluster (the engine's HttpTransport stance).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
