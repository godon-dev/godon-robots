[package]
name = "godon-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The tender body — the vessel walk engine, ported from the python original (vessel rung 10)"

[lib]
name = "godon_engine"
path = "src/lib.rs"

[dependencies]
# Sync client on purpose: the python original is per-verb short
# connections on a sequential trial loop — one mechanism, ported 1:1.
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde_json = "1"
chrono = "0.4"
