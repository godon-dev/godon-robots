[package]
name = "godon-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The tender body — the vessel walk engine, ported from the python original (vessel rung 10)"

[lib]
name = "godon_engine"
path = "src/lib.rs"

[dependencies]
# Sync client on purpose: the python original is per-verb short
# connections on a sequential trial loop — one mechanism, ported 1:1.
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde_json = "1"
chrono = "0.4"
# The seek wish's launch seed: sha256(wish_id)[:8] big-endian, the
# python `hashlib.sha256` receipt verbatim (seek_wish.launch_seed).
sha2 = "0.10"
# Blocking on purpose: the coordinator's causal calls and the notebook
# walk ride the same sequential body the python did (urllib, inline).
# No TLS feature: the estate's causal URL is plain http
# (http://godon-godon-causal:9091); an https URL would surface as a
# dark call, never a silent downgrade.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
# The strain family crates — compiled in per the purpose-profile
# ruling; the engine's boot-time load_strain check rides them.
strain_bench_generic = { package = "godon-strain-bench-generic", path = "../strain-bench-generic" }
strain_bench_greenhouse = { package = "godon-strain-bench-greenhouse", path = "../strain-bench-greenhouse" }
strain_bench_microgrid = { package = "godon-strain-bench-microgrid", path = "../strain-bench-microgrid" }
strain_linux_performance = { package = "godon-strain-linux-performance", path = "../strain-linux-performance" }
