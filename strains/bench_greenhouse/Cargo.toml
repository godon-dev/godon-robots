[package]
name = "godon-strain-bench-greenhouse"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The greenhouse bench strain - dial registry and create-time preflight, ported from strains/bench_greenhouse (vessel rung 10)"

[lib]
name = "strain_bench_greenhouse"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: python dicts iterate in insertion order; the
# preflight's error lists and the registry's supported-lists ride
# that order, so parsed configs keep their wire order here too.
serde_json = { version = "1", features = ["preserve_order"] }
