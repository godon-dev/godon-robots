[workspace]
resolver = "2"
members = [
    "engine",
    "strains/bench_generic",
    "strains/bench_greenhouse",
    "strains/bench_microgrid",
    "strains/linux_performance",
    "wmill",
    "reconnaissance",
    "effectuation",
]
# The vessel rung-10 rust port (chime designs/2026-10-15-rung10-rust-port-plan.md).
# Crates land WITH their ports, not empty: slice 8 brings the windmill
# client (godon-wmill) and the reconnaissance/effectuation
# components. The family
# strain crates (rung 10 slice 7) carry the dial registries and
# create-time preflights — cut along family lines so purpose profiles
# stay one factory flag later.

[workspace.package]
edition = "2021"
license = "AGPL-3.0"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
