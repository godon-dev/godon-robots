[workspace]
resolver = "2"
members = ["crates/engine"]
# The vessel rung-10 rust port (chime designs/2026-10-15-rung10-rust-port-plan.md).
# Crates land WITH their ports, not empty: family strain crates (bench,
# linux) and recon/effectuation arrive in their own slices, cut along
# family lines so purpose profiles stay one factory flag later.

[workspace.package]
edition = "2021"
license = "AGPL-3.0"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
