[package]
name = "godon-robots"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The tender body - the repo root is the platform entry (the godon-engine binary, the invocation surface, the router); the dirs below are the organ's part crates, wmill the outbound half of the seam"

# The binary keeps the estate's name: the image ENTRYPOINT, the ci
# smoke, and the windmill paths all say godon-engine - the package
# boundary is repo structure, the artifact name is the contract.
[[bin]]
name = "godon-engine"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# the Serialize trait path for the preflight arm's passthrough bound
serde = { version = "1", default-features = false }
# the tender engine (the worker loop, the ledger, the Wmill trait)
godon-engine = { path = "engine" }
# the leaf libraries the dispatch serves
godon_recon = { package = "godon-recon", path = "reconnaissance" }
godon_effectuation = { package = "godon-effectuation", path = "effectuation" }
godon_wmill = { package = "godon-wmill", path = "wmill" }
# the strain families (the preflight arm dispatches into their crates)
strain_bench_generic = { package = "godon-strain-bench-generic", path = "strains/bench_generic" }
strain_bench_greenhouse = { package = "godon-strain-bench-greenhouse", path = "strains/bench_greenhouse" }
strain_bench_microgrid = { package = "godon-strain-bench-microgrid", path = "strains/bench_microgrid" }
strain_linux_performance = { package = "godon-strain-linux-performance", path = "strains/linux_performance" }

[workspace]
resolver = "2"
members = [
    "engine",
    "strains/bench_generic",
    "strains/bench_greenhouse",
    "strains/bench_microgrid",
    "strains/linux_performance",
    "wmill",
    "reconnaissance",
    "effectuation",
]
# The vessel rung-10 rust port (chime designs/2026-10-15-rung10-rust-port-plan.md).
# The repo ROOT is the platform entry (the godon-engine binary); the
# part crates live in the organ folders - the controller repo's own
# shape, now the estate standard for every organ.

[workspace.package]
edition = "2021"
license = "AGPL-3.0"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
